################
### MONITORS ###
################
source=~/.config/hypr/mocha.conf


# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,1920x1080@144,0x0,1, transform, 3
monitor=DP-1,2560x1440@144,1080x480,1
monitor=DP-2,2560x1440@144,3640x480,1
monitor=Unknown-1, disable

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$menu = fuzzel --list-executables-in-path

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

#exec-once = swayidle -w timeout 600 'hyprlock' timeout 630 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'
exec-once = hyprpaper
exec-once = dbus-update-activation-environment --all
exec-once = mpd
exec-once = xrandr --output DP-1 --primary
exec-once = wlsunset -l "27.95" -L "-82.45" -t 3000
exec-once = mako
exec-once = waybar
exec = openrgb -p red.orp

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,16
env = XCURSOR_THEME,catppuccin-mocha-red-cursors
env = HYPRCURSOR_THEME,catppuccin-mocha-red-cursors
env = LIBVA_DRIVER_NAME,radeonsi
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = WLR_DRM_NO_ATOMIC,1
env = NICOTINE_GTK_VERSION,3

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba($redAlphaff)
    col.inactive_border = rgba($surface2Alphaff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = hy3
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Opacity settings
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_around = 0.5

    shadow {
        enabled = false
        range = 10
        render_power = 10
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

group {
  col.border_active = rgba($redAlphaff)

  groupbar {
    enabled = false
  }
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.9, 0.5, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 2.5, md3_decel, popin 80%
    animation = border, 1, 6, md3_decel
    animation = fade, 1, 2.5, md3_decel
    animation = workspaces, 1, 4.5, easeOutExpo, slide
    animation = specialWorkspace, 1, 2.5, md3_decel, slidevert
}



# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    enable_swallow = false

    swallow_regex = ^(kitty)$
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 2
    float_switch_override_focus = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
  no_warps = false
  enable_hyprcursor = false
}

plugin {
  hy3 {
    no_gaps_when_only = 2
    group_inset = 0
    tabs {
      padding = 0
      height = 0
      render_text = false
    }
  }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = glorious-model-o
    sensitivity = -1.5
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Screenshots / Grim shortcuts
bind = $mainMod SHIFT, s, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod SHIFT, Print, exec, grimblast save active - | swappy -f -
bind = Control, Print, exec, grimblast save output - | swappy -f -
bind = , Print, exec, grimblast save screen - | swappy -f -
bind = $mainMod SHIFT, p, exec, hyprpicker -a

bind = $mainMod,l, exec, hyprlock

# Fullscreening
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
#bind = $mainMod, M, exit,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, bemoji -cn
bind = $mainMod, p, exec, passmenu

# Move focus with mainMod + arrow keys
#bind = $mainMod, left, movefocus, l
#bind = $mainMod, right, movefocus, r
#bind = $mainMod, up, movefocus, u
#bind = $mainMod, down, movefocus, d

# Move focus with mainMod + arrow keys
#bind = $mainMod SHIFT, left, movewindow, l
#bind = $mainMod SHIFT, right, movewindow, r
#bind = $mainMod SHIFT, up, movewindow, u
#bind = $mainMod SHIFT, down, movewindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up, hy3:movefocus, u
bind = $mainMod, down, hy3:movefocus, d

# Move focus with mainMod + arrow keys
bind = $mainMod SHIFT, left, hy3:movewindow, l
bind = $mainMod SHIFT, right, hy3:movewindow, r
bind = $mainMod SHIFT, up, hy3:movewindow, u
bind = $mainMod SHIFT, down, hy3:movewindow, d

# Make splits (hy3)

bind = $mainMod, h, hy3:makegroup, h
bind = $mainMod, v, hy3:makegroup, v
bind = $mainMod, x, hy3:changegroup, toggletab

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move workspace in a given direction
bind = $mainMod Control, left, movecurrentworkspacetomonitor, l
bind = $mainMod Control, right, movecurrentworkspacetomonitor, r
bind = $mainMod Control, up, movecurrentworkspacetomonitor, u
bind = $mainMod Control, down, movecurrentworkspacetomonitor, d

# Example special workspace (scratchpad)
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspacesilent, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on

windowrule = match:class ^(termfilechooser)$, border_color rgba($peachAlphaff)

windowrule = match:class ^(looking-glass-client)$, float on
windowrule = match:class ^(yad)$, float on
windowrule = match:title ^(Extension\: \(MetaMask\)*)$, float on

windowrule = match:class ^(.*[Ll]unar[Cc]lient.*)$, immediate on
windowrule = match:class ^(cs2)$, immediate on
windowrule = match:class ^(glxgears)$, immediate on
windowrule = match:class ^(tf_linux64)$, immediate on
windowrule = match:class ^(steam_app_0)$, immediate on
windowrule = match:class ^(org.vinegarhq.Sober)$, immediate on
windowrule = match:title ^(Open Files)$, float on
windowrule = match:class ^(termfilechooser)$, float on
windowrule = match:title ^(Media viewer)$, match:fullscreen 0, float on
windowrule = match:class ^(hyprland-share-picker)$, float on

layerrule = match:namespace launcher, blur on
layerrule = match:namespace launcher, dim_around on
