background {
    monitor =
    path = ~/.wallpaper
    blur_size = 7
    blur_passes = 3
    brightness = 0.4
    vibrancy = 0.6
}

label {
    monitor = DP-1
    text = Welcome back, $USER.
    color = rgba(200, 200, 200, 1.0)
    font_family = monospace
    font_size = 25
    position = 0, 120
    halign = center
    valign = center
}

animations {
  enabled = true
  animation=fadeOut,0,0,default
}

label {
    monitor = DP-1
    text = The time is $TIME.
    color = rgba(200, 200, 200, 1.0)
    font_family = monospace
    font_size = 25
    position = 0, 80
    halign = center
    valign = center
}


input-field {
    monitor = DP-1
    size = 150, 35
    outline_thickness = 0     # removed outline
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)  # transparent outer color
    inner_color = rgba(0, 0, 0, 0)  # transparent inner color
    font_color = rgb(200, 200, 200) # made text color match the label
    fade_on_empty = true
    placeholder_text = <i></i>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
    check_color = rgba(200, 200, 200, 1.0)
    fail_color = rgba(200, 200, 200, 1.0)
}
